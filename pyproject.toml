[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roc-mcs"
version = "0.1.0"
description = "Rocking curve analysis for ORTEC MCS measurements"
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
    "openpyxl",
    "PyYAML",
    "tqdm",
    "scipy",
    "h5py",
    "PyQt6",
    "pyqtgraph==0.14.0",    
    "jax==0.11.2",
    "jaxlib==0.11.2",    

]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
roc-mcs = "roc_mcs.cli:main"